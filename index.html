<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Workspace | CineByDheeraj</title>
  <style>
    :root {
      --bg-dark: #121814;
      --panel-bg: #1c241f;
      --card-bg: #232d27;
      --text-main: #e2e8e4;
      --text-muted: #9ba89f;
      --paper-yellow: #d8c9a8;
      --accent-red: #e0564c;
      --accent-green: #4cb87c;
      --border-color: #2d3831;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
    }

    .workspace-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .portal-box {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .portal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }

    .portal-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--text-main);
    }

    .red-edit-badge {
      background-color: var(--accent-red);
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
      display: inline-flex;
      gap: 6px;
    }

    .brand-watermark {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
    }

    .dropdown-container {
      position: relative;
    }

    .dropdown-trigger {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      z-index: 10;
      min-width: 160px;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      text-align: left;
      padding: 8px 12px;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 13px;
      cursor: pointer;
    }

    .dropdown-item:hover {
      background-color: var(--panel-bg);
    }

    .dropdown-item.delete {
      color: var(--accent-red);
    }

    .date-group-header {
      font-size: 12px;
      font-weight: bold;
      color: var(--paper-yellow);
      margin: 16px 0 8px 0;
      letter-spacing: 0.5px;
    }

    .schedule-item {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .schedule-item.is-completed {
      opacity: 0.7;
    }

    .status-badge {
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-InProgress { background: #2b4535; color: #6ee7b7; }
    .status-Upcoming { background: #433822; color: #fde047; }
    .status-Completed { background: #27354a; color: #93c5fd; }

    .schedule-meta {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .meta-tag strong {
      color: var(--text-main);
    }

    .pdf-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      color: var(--paper-yellow);
      text-decoration: none;
    }

    .client-note {
      font-size: 12px;
      color: var(--text-muted);
    }

    .btn-save, .btn-item-action {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-item-action {
      padding: 2px 6px;
      font-size: 11px;
    }

    .btn-item-action.delete {
      color: var(--accent-red);
    }
  </style>
</head>
<body>

  <div class="workspace-container">
    <div id="clientsPortalsList"></div>
  </div>

  <script>
    // Sample Initial Data State
    let targetClient = null;
    let isNewClientFormOpen = false;
    let activeClientFormId = null;
    let activeScheduleClientId = null;
    let activeScheduleItemId = null;

    let clients = [
      {
        id: "client_1",
        name: "Fox and Finch",
        editsDone: 0,
        editLimit: 20,
        badgeLabel: "REELS DONE",
        note: "",
        items: [
          { id: "1", title: "Suvarna kuteer", itemType: "Both", shootDate: "2026-08-04", editDate: "", status: "InProgress" },
          { id: "2", title: "Manufacturing unit", itemType: "Both", shootDate: "2026-08-05", editDate: "", status: "InProgress" },
          { id: "3", title: "ProCafe", itemType: "Both", shootDate: "2026-08-06", editDate: "", status: "InProgress" },
          { id: "4", title: "Sivani garu video", itemType: "Both", shootDate: "2026-08-06", editDate: "", status: "Completed" },
          { id: "5", title: "Tvs edit", itemType: "Edit", shootDate: "", editDate: "2026-08-06", status: "Completed" },
          { id: "6", title: "Amrutha Client", itemType: "Both", shootDate: "", editDate: "", status: "InProgress" }
        ]
      }
    ];

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatDate(dateStr) {
      if (!dateStr || dateStr === 'TBD') return 'TBD';
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0].slice(2)}`;
      }
      return dateStr;
    }

    function getDateCategoryLabel(dateStr) {
      if (!dateStr) return 'UNSCHEDULED / TBD';
      return `DATE: ${formatDate(dateStr)}`;
    }

    function toggleDropdown(id, event) {
      event.stopPropagation();
      const el = document.getElementById(`dropdown-${id}`);
      if (el) el.classList.toggle('show');
    }

    function buildClientFormHtml(client) { return ''; }
    function buildScheduleFormHtml(item) { return ''; }
    function startEditScheduleItem(cId, iId) {}
    function removeItemFromClient(cId, iId) {}
    function openScheduleForm(cId) {}
    function shareClientLink(name) {}
    function startEditClientPortal(cId) {}
    function deleteClient(cId) {}

    /* RENDER CLIENT PORTALS (ACTIVE TASKS TOP, COMPLETED BOTTOM) */
    function renderClientsPortals() {
      const container = document.getElementById('clientsPortalsList');
      if (!container) return;
      container.innerHTML = '';

      let filteredClients = clients;

      if (targetClient) {
        filteredClients = clients.filter(c => c.name.toLowerCase() === targetClient.toLowerCase());
      }

      let topSlotHtml = isNewClientFormOpen ? buildClientFormHtml(null) : '';

      if (filteredClients.length === 0 && !isNewClientFormOpen) {
        container.innerHTML = `<div class="empty">${targetClient ? 'no portal found for ' + escapeHtml(targetClient) : 'no client portals added yet'}</div>`;
        return;
      }

      let htmlContent = topSlotHtml;

      filteredClients.forEach(c => {
        let clientCardFormHtml = (activeClientFormId === c.id) ? buildClientFormHtml(c) : '';
        let scheduleFormHtml = '';

        let itemsHtml = '';
        if (c.items && c.items.length > 0) {
          const sortedItems = [...c.items];

          // Determine primary sorting date
          sortedItems.forEach(item => {
            item._primaryDate = item.shootDate || item.editDate || '';
          });

          // Separate Active vs Completed projects
          const activeItems = sortedItems.filter(item => item.status !== 'Completed');
          const completedItems = sortedItems.filter(item => item.status === 'Completed');

          // Sort each group chronologically by date
          const sortByDate = (arr) => {
            return arr.sort((a, b) => {
              if (!a._primaryDate) return 1;
              if (!b._primaryDate) return -1;
              return a._primaryDate.localeCompare(b._primaryDate);
            });
          };

          const sortedActive = sortByDate(activeItems);
          const sortedCompleted = sortByDate(completedItems);

          // Group renderer
          const renderGroupedItems = (itemList) => {
            let groupHtml = '';
            const itemGroups = {};

            itemList.forEach(item => {
              const key = item._primaryDate || 'TBD';
              if (!itemGroups[key]) itemGroups[key] = [];
              itemGroups[key].push(item);
            });

            Object.keys(itemGroups).forEach(dateKey => {
              const sampleGroup = itemGroups[dateKey];
              const headerTitle = getDateCategoryLabel(dateKey === 'TBD' ? '' : dateKey);

              groupHtml += `<div class="date-group-header">${headerTitle}</div>`;

              sampleGroup.forEach(item => {
                const type = item.itemType || 'Both';
                let showShootTag = (type === 'Both' || type === 'Shoot');
                let showEditTag = (type === 'Both' || type === 'Edit');

                groupHtml += `
                  <div class="schedule-item ${item.status === 'Completed' ? 'is-completed' : ''}">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <strong>${escapeHtml(item.title)}</strong>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <span class="status-badge status-${item.status}">${item.status}</span>
                        <div class="admin-only item-actions">
                          <button class="btn-item-action" onclick="startEditScheduleItem('${c.id}', '${item.id}')">✏️ Edit</button>
                          <button class="btn-item-action delete" onclick="removeItemFromClient('${c.id}', '${item.id}')">✕ Delete</button>
                        </div>
                      </div>
                    </div>
                    <div class="schedule-meta">
                      ${showShootTag ? `<span class="meta-tag">🎬 Start Date: <strong>${formatDate(item.shootDate)}</strong></span>` : ''}
                      ${showEditTag ? `<span class="meta-tag">✂️ Edit Deadline: <strong>${formatDate(item.editDate)}</strong></span>` : ''}
                    </div>
                    ${item.pdfUrl ? `<a href="${escapeHtml(item.pdfUrl)}" target="_blank" class="pdf-link">📄 Open Script PDF / Document</a>` : ''}
                    ${item.note ? `<div class="client-note" style="margin-top:6px;">${escapeHtml(item.note)}</div>` : ''}
                  </div>
                `;
              });
            });

            return groupHtml;
          };

          // Append Active projects first, followed by Completed projects
          if (sortedActive.length > 0) {
            itemsHtml += renderGroupedItems(sortedActive);
          }

          if (sortedCompleted.length > 0) {
            itemsHtml += `<div style="margin-top: 16px; border-top: 1px dashed var(--border-color); padding-top: 8px;">`;
            itemsHtml += renderGroupedItems(sortedCompleted);
            itemsHtml += `</div>`;
          }
        } else {
          itemsHtml = '<div style="font-size:13px; color:#D8C9A8; font-style:italic;">No schedules or scripts added to this portal yet.</div>';
        }

        if (activeScheduleClientId === c.id) {
          const activeItem = c.items ? c.items.find(i => i.id === activeScheduleItemId) : null;
          scheduleFormHtml = buildScheduleFormHtml(activeItem);
        }

        const hasNumbers = (c.editsDone !== undefined && c.editsDone !== null && c.editLimit !== undefined && c.editLimit !== null);
        const badgeLabelText = c.badgeLabel || 'REELS / VIDEOS DONE';

        htmlContent += `
          <div class="portal-box">
            <div class="portal-header">
              <div>
                <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                  <div class="portal-title">${escapeHtml(c.name)}</div>
                  ${hasNumbers ? `
                    <div class="red-edit-badge">
                      <span class="red-edit-label">${escapeHtml(badgeLabelText)}</span>
                      <span class="red-edit-number">${c.editsDone}/${c.editLimit}</span>
                    </div>
                  ` : ''}
                  <a href="https://www.instagram.com/cineby.dheeraj?igsh=cTM1cXRrZW00dXpy&utm_source=qr" target="_blank" class="brand-watermark">@cinebydheeraj</a>
                </div>
                ${c.note ? `<div class="client-note">${escapeHtml(c.note)}</div>` : ''}
              </div>
              <div class="dropdown-container">
                <button class="dropdown-trigger" onclick="toggleDropdown('${c.id}', event)">⋮</button>
                <div class="dropdown-menu" id="dropdown-${c.id}">
                  <button class="dropdown-item" onclick="shareClientLink('${escapeHtml(c.name)}')">🔗 Share Client Portal</button>
                  <button class="dropdown-item" onclick="startEditClientPortal('${c.id}')">✏️ Edit Client Portal</button>
                  <button class="dropdown-item delete" onclick="deleteClient('${c.id}')">🗑️ Delete Portal</button>
                </div>
              </div>
            </div>

            ${clientCardFormHtml}

            <div style="margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:12px; font-weight:bold; letter-spacing:0.5px; text-transform:uppercase; color:var(--paper-yellow);">Schedules & Script Documents</span>
              <button class="admin-only btn-save" style="font-size:11px; padding:4px 10px;" onclick="openScheduleForm('${c.id}')">+ Add Schedule/Script</button>
            </div>

            ${scheduleFormHtml}

            ${itemsHtml}
          </div>
        `;
      });

      container.innerHTML = htmlContent;
    }

    // Initialize initial render
    document.addEventListener('DOMContentLoaded', () => {
      renderClientsPortals();
    });

    window.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('show'));
    });
  </script>
</body>
</html>
