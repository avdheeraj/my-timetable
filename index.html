<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Team Schedule</title>
  <style>
    :root {
      --bg-main: #131a15;
      --bg-card: #1c2620;
      --bg-sidebar: #0e1310;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --accent-gold: #d4af37;
      --badge-green: #22c55e;
      --badge-gold: #eab308;
      --border-color: #2a382f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 220px;
      background-color: var(--bg-sidebar);
      padding: 20px;
      border-right: 1px solid var(--border-color);
    }

    .sidebar h2 {
      color: var(--accent-gold);
      font-size: 1.1rem;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-item {
      display: block;
      padding: 10px 14px;
      margin-bottom: 8px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .nav-item.active {
      background-color: #e2cca0;
      color: #131a15;
      font-weight: 600;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
    }

    .header-section {
      text-align: center;
      margin-bottom: 30px;
    }

    .header-section h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .header-section p {
      color: var(--accent-gold);
      font-style: italic;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }

    .header-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      align-items: center;
    }

    .tag-handle {
      background: #1e2922;
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      border: 1px solid var(--border-color);
    }

    .btn-action {
      background: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .btn-action.primary {
      background: var(--accent-gold);
      color: #000;
      font-weight: 600;
      border: none;
    }

    /* Person Section & Header */
    .person-group {
      margin-bottom: 35px;
    }

    .person-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #233129;
      color: var(--accent-gold);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
      border: 1px solid var(--border-color);
    }

    /* Task Card */
    .task-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }

    .task-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .task-title-row h3 {
      font-size: 1rem;
      font-weight: 600;
    }

    .task-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid;
    }

    .status-badge.upcoming {
      color: var(--accent-gold);
      border-color: var(--accent-gold);
      background: rgba(212, 175, 55, 0.1);
    }

    .status-badge.completed {
      color: var(--badge-green);
      border-color: var(--badge-green);
      background: rgba(34, 197, 94, 0.1);
    }

    .btn-small {
      background: transparent;
      color: var(--accent-gold);
      border: 1px solid var(--border-color);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .task-meta {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .meta-chip {
      background: #131a15;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.75rem;
      border: 1px solid var(--border-color);
    }

    .task-desc {
      color: var(--text-muted);
      font-size: 0.82rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>📌 Workspace</h2>
    <a href="#" class="nav-item">📌 Desk Pad</a>
    <a href="#" class="nav-item">👤 Client Portals</a>
    <a href="#" class="nav-item active">👥 Team Schedule</a>
    <a href="#" class="nav-item">💡 Team Learnings</a>
  </aside>

  <!-- Main Area -->
  <main class="main-content">
    <div class="header-section">
      <h1>Team Schedule</h1>
      <p>live shoot schedule & task deadlines for the team</p>
      <div class="header-actions">
        <span class="tag-handle">@cinebydheeraj</span>
        <button class="btn-action">🔗 Copy Team Link</button>
        <button class="btn-action primary">+ Add Team Task</button>
      </div>
    </div>

    <!-- Container where team schedule will be populated -->
    <div id="teamScheduleContainer"></div>
  </main>

  <script>
    // Sample task data list
    const initialTasks = [
      {
        id: 1,
        assignedTo: "ABVIY",
        title: "SEARCH CLIENTS",
        status: "UPCOMING",
        shootDate: "03/08/26",
        editDeadline: "TBD",
        description: "INSTAGRAM"
      },
      {
        id: 2,
        assignedTo: "ABVIY",
        title: "Death Stranding edit",
        status: "COMPLETED",
        shootDate: "03/08/26",
        editDeadline: "04/08/26",
        description: "Per Edit 1250"
      },
      {
        id: 3,
        assignedTo: "ABVIY",
        title: "WATCH YT PREMIERE PRO",
        status: "UPCOMING",
        shootDate: "TBD",
        editDeadline: "TBD",
        description: ""
      },
      {
        id: 4,
        assignedTo: "ASVIY",
        title: "Chemolion Gameplay edit",
        status: "COMPLETED",
        shootDate: "05/08/26",
        editDeadline: "07/08/26",
        description: ""
      },
      {
        id: 5,
        assignedTo: "ASVIY",
        title: "w/carry",
        status: "UPCOMING",
        shootDate: "08/08/26",
        editDeadline: "TBD",
        description: ""
      },
      {
        id: 6,
        assignedTo: "ASVIY",
        title: "Rangaa",
        status: "UPCOMING",
        shootDate: "13/08/26",
        editDeadline: "TBD",
        description: "Little descriptions about every part of the game play should be updated for rangaa"
      }
    ];

    function renderTeamSchedule(tasks) {
      const container = document.getElementById("teamScheduleContainer");
      container.innerHTML = "";

      // 1. Group tasks by assignedTo name
      const groupedTasks = tasks.reduce((acc, task) => {
        const personKey = task.assignedTo ? task.assignedTo.toUpperCase() : "UNASSIGNED";
        if (!acc[personKey]) {
          acc[personKey] = [];
        }
        acc[personKey].push(task);
        return acc;
      }, {});

      // 2. Iterate per unique person and create a single header block
      Object.keys(groupedTasks).forEach(personName => {
        const personGroup = document.createElement("div");
        personGroup.className = "person-group";

        // Create the single person header badge
        const personHeader = document.createElement("div");
        personHeader.className = "person-header";
        personHeader.innerHTML = `👤 ${personName}`;
        personGroup.appendChild(personHeader);

        // Render all tasks assigned to this person
        groupedTasks[personName].forEach(task => {
          const taskCard = document.createElement("div");
          taskCard.className = "task-card";

          const statusClass = task.status.toLowerCase();

          taskCard.innerHTML = `
            <div class="task-title-row">
              <h3>${task.title}</h3>
              <div class="task-controls">
                <span class="status-badge ${statusClass}">${task.status}</span>
                <button class="btn-small">✏️ Edit</button>
                <button class="btn-small">✕ Delete</button>
              </div>
            </div>
            <div class="task-meta">
              <span class="meta-chip">📷 Shoot: ${task.shootDate}</span>
              <span class="meta-chip">✂️ Edit Deadline: ${task.editDeadline}</span>
            </div>
            ${task.description ? `<p class="task-desc">${task.description}</p>` : ''}
          `;

          personGroup.appendChild(taskCard);
        });

        container.appendChild(personGroup);
      });
    }

    // Initial render call
    renderTeamSchedule(initialTasks);
  </script>
</body>
</html>
